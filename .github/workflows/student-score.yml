name: CP2 — Student Score

on:
  workflow_run:
    workflows: ["Checkpoint 2 — Auto and Teacher Grade"]
    types: [completed]
  workflow_dispatch:
  schedule:
    - cron: '23 * * * *'

permissions:
  contents: read
  pull-requests: read
  issues: write

jobs:
  score:
    if: ${{ github.repository != 'KLIS-CS/GitHub-Feature-Branch-Pull-Request-Workflow' }}
    runs-on: ubuntu-latest

    steps:
      - name: Build student score view
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const sourceMarker = '<!-- klis-cp2-progress -->';
            const scoreMarker = '<!-- klis-cp2-local-score -->';

            const issues = await github.paginate(github.rest.issues.listForRepo, { owner, repo, state: 'all', per_page: 100 });
            const candidates = [];
            for (const item of issues) {
              if (!item.comments) continue;
              const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number: item.number, per_page: 100 });
              for (const c of comments) {
                if (c.user?.login === 'github-actions[bot]' && c.body?.includes(sourceMarker)) candidates.push({ ...c, parent: item });
              }
            }
            candidates.sort((a,b) => new Date(b.updated_at || b.created_at) - new Date(a.updated_at || a.created_at));
            const progress = candidates[0];
            const automatic = Math.max(0, Math.min(60, Number(progress?.body?.match(/\*\*Automatic:\*\*\s*(\d+)\/60/i)?.[1] || 0)));

            let teacher = null;
            let grader = null;
            let feedback = '';
            let updatedAt = null;
            const gradeUrl = `https://raw.githubusercontent.com/KLIS-CS/GitHub-Feature-Branch-Pull-Request-Workflow/grades/.cp2-grades/${encodeURIComponent(owner.toLowerCase())}.json?ts=${Date.now()}`;
            const response = await fetch(gradeUrl, { headers: { 'User-Agent': 'KLIS-CS-CP2-Student-Score' } });
            if (response.ok) {
              const grade = await response.json();
              if (Number.isInteger(grade.teacherScore)) teacher = grade.teacherScore;
              grader = grade.grader || null;
              feedback = grade.feedback || '';
              updatedAt = grade.updatedAt || null;
            } else if (response.status !== 404) {
              core.warning(`Teacher grade sync returned HTTP ${response.status}.`);
            }

            const total = automatic + (teacher ?? 0);
            const finalLine = teacher === null ? 'pending teacher review' : `${total}/100`;
            const status = automatic < 60 ? '🟡 **IN PROGRESS — complete the missing automatic evidence.**' : teacher === null ? '🔵 **AUTOMATIC CHECKS PASSED — awaiting teacher review in the mother repository.**' : `✅ **FINAL SCORE: ${total}/100**`;
            const feedbackBlock = teacher === null ? 'Teacher feedback will appear here after the mother repository grade is published.' : feedback ? `> ${feedback.replace(/\n/g, '\n> ')}` : '> Teacher grade published. No written feedback was included.';
            const progressUrl = progress?.html_url || progress?.parent?.html_url || '';

            const body = `${scoreMarker}
            # CP2 — Score

            **Repository:** https://github.com/${owner}/${repo}  
            **Automatic score:** ${automatic}/60  
            **Teacher score:** ${teacher === null ? 'awaiting review' : `${teacher}/40${grader ? ` by @${grader}` : ''}`}  
            **Final score:** ${finalLine}

            | Component | Score | Evidence |
            |---|---:|---|
            | Automatic workflow evidence | ${automatic}/60 | ${progressUrl ? `[Open detailed CP2 progress](${progressUrl})` : 'Run the CP2 grader to generate progress evidence.'} |
            | 🧑‍🏫 Teacher review | ${teacher === null ? '—/40' : `${teacher}/40`} | ${updatedAt ? `synced ${updatedAt}` : 'awaiting review'} |

            ${status}

            ## Teacher feedback
            ${feedbackBlock}

            ## Submit for teacher review
            [Submit CP2 to the mother repository](https://github.com/KLIS-CS/GitHub-Feature-Branch-Pull-Request-Workflow/issues/new?template=cp2-submission.yml)

            After the teacher grades in the mother repository, this Issue refreshes automatically within about one hour. You can also run **Actions → CP2 — Student Score → Run workflow**.
            `;

            let scoreIssue = issues.find(i => !i.pull_request && i.body?.includes(scoreMarker));
            if (scoreIssue) {
              await github.rest.issues.update({ owner, repo, issue_number: scoreIssue.number, state: 'open', title: 'CP2 — Score', body });
            } else {
              await github.rest.issues.create({ owner, repo, title: 'CP2 — Score', body });
            }

            await core.summary.addHeading(`CP2: ${total}/100`).addRaw(`Automatic: ${automatic}/60\n`).addRaw(`Teacher: ${teacher === null ? 'awaiting review' : `${teacher}/40`}\n`).write();
