name: "Submit CP2"
description: "Submit your public CP2 practice repository for automatic and teacher grading."
title: "[CP2] Feature Branch & Pull Request Submission"
body:
  - type: markdown
    attributes:
      value: |
        Submit the **repository URL** for your completed CP2 copy. Your repository must be Public so the KLIS-CS mother grader can inspect the branch, Pull Request, and submission evidence.

  - type: input
    id: repo
    attributes:
      label: Practice Repository URL
      description: Paste the GitHub repository URL. A /tree/main or file URL is also accepted and will be normalized to the repository.
      placeholder: https://github.com/YOUR-USERNAME/cp2-feature-branch-pr-workflow
    validations:
      required: true

  - type: input
    id: username
    attributes:
      label: GitHub Username
      placeholder: YOUR-GITHUB-USERNAME
    validations:
      required: true

  - type: checkboxes
    id: integrity
    attributes:
      label: Integrity Check
      options:
        - label: I used the official KLIS-CS CP2 Copy Exercise.
          required: true
        - label: My required cp2-USERNAME branch and open Pull Request are visible in this repository.
          required: true
        - label: I did not include passwords, API keys, tokens, or other secrets.
          required: true
