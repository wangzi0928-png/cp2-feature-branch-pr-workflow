name: Start Exercise

on:
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  start:
    runs-on: ubuntu-latest
    steps:
      - name: Create checkpoint issue
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const marker = '<!-- klis-cp2-exercise -->';
            const username = context.actor;
            const branch = `cp2-${username}`;

            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: 'all', per_page: 100
            });
            const existing = issues.find(i => !i.pull_request && i.body?.includes(marker));
            if (existing) {
              core.info(`Exercise issue already exists: #${existing.number}`);
              return;
            }

            const body = `${marker}
            ## Checkpoint 2 — Feature Branch & Pull Request Workflow

            Welcome @${username}.

            **Required branch:** \`${branch}\`

            ### Your task
            1. Clone this repository to your computer.
            2. Create the required branch locally. Do not work on \`main\`.
            3. Edit \`feature.txt\` on the required branch.
            4. Complete \`submission.md\`.
            5. Use \`git status\`, \`git add\`, \`git commit\`, and \`git push\` as part of the workflow.
            6. Push the required branch to GitHub.
            7. Open a Pull Request from the required branch into \`main\`.
            8. Change only \`feature.txt\` and \`submission.md\`.
            9. Leave the Pull Request open for teacher review.

            The automatic grader will verify branch safety, committed/pushed work, and the Pull Request workflow.
            `;

            await github.rest.issues.create({
              owner,
              repo,
              title: 'Exercise: Checkpoint 2 — Feature Branch & Pull Request Workflow',
              body
            });
